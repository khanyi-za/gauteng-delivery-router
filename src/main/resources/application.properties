spring.application.name=gautengLogistics

# Schema is owned by Flyway migrations; Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Gauteng OpenStreetMap extract used by the road network ingester
gautenglogistics.ingest.osm-file=data/gauteng.osm.pbf
gautenglogistics.ingest.enabled=false