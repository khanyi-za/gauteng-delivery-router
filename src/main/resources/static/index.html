<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gauteng Delivery Router</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; }
        body { font-family: system-ui, sans-serif; }
        #panel {
            position: absolute; top: 12px; right: 12px; z-index: 1000; width: 260px;
            background: white; padding: 12px 14px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        #panel h1 { font-size: 16px; margin: 0 0 6px; }
        #panel p { margin: 6px 0; font-size: 14px; }
        #error { color: #b00020; }
        button { margin-top: 6px; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <h1>Gauteng Delivery Router</h1>
    <p id="hint">Click the map to choose where the route starts.</p>
    <p id="result"></p>
    <p id="error"></p>
    <button id="clear">Clear</button>
</div>
<script>
    const map = L.map('map').setView([-26.05, 28.1], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const hint = document.getElementById('hint');
    const result = document.getElementById('result');
    const error = document.getElementById('error');

    let start = null;   // the start marker
    let end = null;     // the end marker
    let drawn = null;   // everything drawn for the current route

    // First click sets the start, second click sets the end and asks for the route
    map.on('click', e => {
        if (!start) {
            start = L.marker(e.latlng, {draggable: true, title: 'Start'}).addTo(map).on('dragend', showRoute);
            hint.textContent = 'Now click where the route ends.';
        } else if (!end) {
            end = L.marker(e.latlng, {draggable: true, title: 'End'}).addTo(map).on('dragend', showRoute);
            hint.textContent = 'Drag a pin to change the route, or press Clear to start again.';
            showRoute();
        }
    });

    document.getElementById('clear').addEventListener('click', () => {
        [start, end, drawn].forEach(layer => layer && layer.remove());
        start = end = drawn = null;
        hint.textContent = 'Click the map to choose where the route starts.';
        result.textContent = error.textContent = '';
    });

    async function showRoute() {
        if (!start || !end) {
            return;
        }
        const from = start.getLatLng();
        const to = end.getLatLng();
        const response = await fetch(`/routes?fromLat=${from.lat}&fromLon=${from.lng}&toLat=${to.lat}&toLon=${to.lng}`);
        const body = await response.json();

        if (drawn) {
            drawn.remove();
            drawn = null;
        }
        if (!response.ok) {
            // The API sends errors as problem details: {"title": ..., "detail": ...}
            result.textContent = '';
            error.textContent = body.detail || body.title;
            return;
        }

        error.textContent = '';
        result.textContent = `${body.distanceKm} km, about ${Math.round(body.durationMinutes)} min `
            + `(searched ${body.intersectionsVisited.toLocaleString()} intersections)`;

        const road = L.polyline(decodePolyline(body.geometry), {color: '#1565c0', weight: 5});
        // Dashed lines from the clicked points to where the route really starts and ends
        const startGap = L.polyline([from, toLatLng(body.start.location)], {color: 'grey', dashArray: '4 6'});
        const endGap = L.polyline([toLatLng(body.end.location), to], {color: 'grey', dashArray: '4 6'});
        drawn = L.featureGroup([road, startGap, endGap]).addTo(map);
        map.fitBounds(drawn.getBounds(), {padding: [40, 40]});
    }

    function toLatLng(location) {
        return [location.lat, location.lon];
    }

    // The same format the server's PolylineEncoder writes: each point is the change from the
    // previous one, at 5 decimal places, 5 bits per character
    function decodePolyline(encoded) {
        const points = [];
        let position = 0, lat = 0, lon = 0;
        const nextValue = () => {
            let value = 0, shift = 0, chunk;
            do {
                chunk = encoded.charCodeAt(position++) - 63;
                value |= (chunk & 0x1f) << shift;
                shift += 5;
            } while (chunk >= 0x20);
            return (value & 1) ? ~(value >> 1) : value >> 1;
        };
        while (position < encoded.length) {
            lat += nextValue();
            lon += nextValue();
            points.push([lat / 1e5, lon / 1e5]);
        }
        return points;
    }
</script>
</body>
</html>
